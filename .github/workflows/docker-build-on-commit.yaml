---
# yamllint disable rule:line-length
name: Build and Push On Commit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
      [opened, reopened, synchronize]

env:
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write

jobs:
  prepare-variables:
    runs-on: ubuntu-latest
    steps:
      - id: tag_build_number
        run: echo "tag=$(echo '${{github.ref_name}}' | tr -cs 'a-zA-Z0-9' '-')$(date +'%Y%m%d%H%M%S')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - id: tag_snapshot
        run: echo "tag=$(echo '${{github.ref_name}}' | tr -cs 'a-zA-Z0-9' '-')snapshot" >> "$GITHUB_OUTPUT"
    outputs:
      tag_build_number: ${{ steps.tag_build_number.outputs.tag }}
      tag_snapshot: ${{ steps.tag_snapshot.outputs.tag }}
  build-and-push:
    runs-on: ubuntu-latest
    needs: prepare-variables
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker
      
      - name: Build and load test core-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          build-args: |
            BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-core-base:test
          tags: |
            ghcr.io/netcracker/qubership-core-base:test
          file: images/core-alpine/Dockerfile

      - name: Build and load test java 21 image with prof
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          build-args: |
            BASE_IMAGE=ghcr.io/netcracker/qubership-core-base:test
            BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-java-base-prof:21-test
          tags: |
            ghcr.io/netcracker/qubership-java-base:21-test
            ghcr.io/netcracker/qubership-java-base-prof:21-test
          file: images/java-21-alpine-prof/Dockerfile

      - name: Build and load test java 25 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          build-args: |
            BASE_IMAGE=ghcr.io/netcracker/qubership-core-base:test
            BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-java-base:25-test
          tags: ghcr.io/netcracker/qubership-java-base:25-test
          file: images/java-25-alpine/Dockerfile

      - name: Build and load test java 25 image with atp
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          build-args: |
            BASE_IMAGE=ghcr.io/netcracker/qubership-java-base:25-test
            BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-java-base-atp:25-test
          tags: ghcr.io/netcracker/qubership-java-base-atp:25-test
          file: images/java-25-alpine-atp/Dockerfile

      - name: Build and load test java 25 image with prof
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          build-args: |
            BASE_IMAGE=ghcr.io/netcracker/qubership-java-base:25-test
            BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-java-base-prof:25-test
          tags: ghcr.io/netcracker/qubership-java-base-prof:25-test
          file: images/java-25-alpine-prof/Dockerfile

      - name: Build and load test core-ubi image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          build-args: |
            BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-core-base:ubi-test
          tags: |
            ghcr.io/netcracker/qubership-core-base:ubi-test
          file: images/core-ubi/Dockerfile

      - name: Build and load test java 25 UBI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          build-args: |
            BASE_IMAGE=ghcr.io/netcracker/qubership-core-base:ubi-test
            BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-java-base:25-ubi-test
          tags: ghcr.io/netcracker/qubership-java-base:25-ubi-test
          file: images/java-25-ubi/Dockerfile

      - name: Build and load test java 25 UBI image with prof
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          build-args: |
            BASE_IMAGE=ghcr.io/netcracker/qubership-java-base:25-ubi-test
            BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-java-base-prof:25-ubi-test
          tags: ghcr.io/netcracker/qubership-java-base-prof:25-ubi-test
          file: images/java-25-ubi-prof/Dockerfile

      - name: Build and load test java 21 UBI image with prof
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          build-args: |
            BASE_IMAGE=ghcr.io/netcracker/qubership-core-base:ubi-test
            BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-java-base-prof:21-ubi-test
          tags: |
            ghcr.io/netcracker/qubership-java-base:21-ubi-test
            ghcr.io/netcracker/qubership-java-base-prof:21-ubi-test
          file: images/java-21-ubi-prof/Dockerfile

      - name: Build and load test nginx base image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          build-args: |
            BASE_IMAGE=ghcr.io/netcracker/qubership-core-base:test
            BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-nginx-base:test
          tags: |
            ghcr.io/netcracker/qubership-nginx-base:test
          file: images/nginx-alpine/Dockerfile

      - name: Build and load test Python Debian image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          build-args: |
            BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-python-base:debian-test
          tags: ghcr.io/netcracker/qubership-python-base:debian-test
          file: images/python-debian/Dockerfile

      - name: Run tests on containers
        run: |
          ./tests/test-suite.sh ghcr.io/netcracker/qubership-core-base:test
          ./tests/test-suite.sh ghcr.io/netcracker/qubership-java-base-prof:21-test
          ./tests/test-suite.sh ghcr.io/netcracker/qubership-java-base:25-test
          ./tests/test-suite.sh ghcr.io/netcracker/qubership-java-base-prof:25-test
          ./tests/test-suite.sh ghcr.io/netcracker/qubership-java-base-atp:25-test
          ./tests/test-suite.sh ghcr.io/netcracker/qubership-core-base:ubi-test
          ./tests/test-suite.sh ghcr.io/netcracker/qubership-java-base:25-ubi-test
          ./tests/test-suite.sh ghcr.io/netcracker/qubership-java-base-prof:25-ubi-test
          ./tests/test-suite.sh ghcr.io/netcracker/qubership-java-base-prof:21-ubi-test
          ./tests/test-suite.sh ghcr.io/netcracker/qubership-nginx-base:test

      - name: Test Python Debian image
        env:
          PYTHON_IMAGE: ghcr.io/netcracker/qubership-python-base:debian-test
        run: |
          for test in args-passing bash-entrypoint-arguments certificates log-format nss signal-propagation version-log; do
            ./tests/test-suite.sh "$PYTHON_IMAGE" "$test"
          done
          docker run --rm "$PYTHON_IMAGE" python -c '
          import bz2, compression.zstd, ctypes, dbm.gnu, lzma, os, platform, readline, sqlite3, ssl, sysconfig
          assert os.getuid() == 10001
          assert os.access(sysconfig.get_path("purelib"), os.W_OK), "appuser cannot write to site-packages"
          expected_version = os.environ["PYTHON_VERSION"]
          actual_version = platform.python_version()
          assert actual_version == expected_version, f"Expected Python {expected_version}, got {actual_version}"
          assert ssl.create_default_context().get_ca_certs()
          '
          docker run --rm --user 123456:0 "$PYTHON_IMAGE" python -c '
          import os, sysconfig
          for path in ("purelib", "scripts"):
              assert os.access(sysconfig.get_path(path), os.W_OK), f"Arbitrary UID cannot write to {path}"
          '
          docker run --rm "$PYTHON_IMAGE" python -m pip --version

      - name: Build and test Node.js Alpine images
        env:
          NODE_IMAGE: ghcr.io/netcracker/qubership-nodejs-base
        run: |
          for major in 24 26; do
            image="$NODE_IMAGE:$major-alpine-test"
            docker build --file "images/node-$major-alpine/Dockerfile" \
              --build-arg BASE_IMAGE=ghcr.io/netcracker/qubership-core-base:test \
              --build-arg "BASE_IMAGE_TAG=$image" \
              --tag "$image" .
            for test in args-passing bash-entrypoint-arguments certificates libstdcpp log-format nss signal-propagation version-log; do
              ./tests/test-suite.sh "$image" "$test"
            done
            docker run --rm --read-only \
              --mount "type=bind,src=$PWD/tests/certificates/certs,dst=/tmp/cert,readonly" \
              "$image" node -e '
            const assert = require("node:assert/strict");
            const { X509Certificate } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            const { getCACertificates } = require("node:tls");
            const expected = new X509Certificate(readFileSync("/tmp/cert/testcert.pem")).fingerprint256;
            assert.equal(process.versions.node.split(".")[0], process.argv[1]);
            assert.equal(process.getuid(), 10001);
            assert(getCACertificates("default").some(pem => new X509Certificate(pem).fingerprint256 === expected));
            ' "$major"
            docker run --rm "$image" npm --version
          done

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 21
          server-id: central

      - name: Cache local Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Test profiler integration
        working-directory: test-profiler
        # language=bash
        run: |
          ./mvnw --batch-mode verify -Dqubership.profiler.java-base-image.tag=ghcr.io/netcracker/qubership-java-base:21-test
          ./mvnw --batch-mode verify -Dqubership.profiler.java-base-image.tag=ghcr.io/netcracker/qubership-java-base-prof:25-test
          ./mvnw --batch-mode verify -Dqubership.profiler.java-base-image.tag=ghcr.io/netcracker/qubership-java-base-prof:25-ubi-test
          ./mvnw --batch-mode verify -Dqubership.profiler.java-base-image.tag=ghcr.io/netcracker/qubership-java-base-prof:21-ubi-test

      - name: Add snapshot tags and push images
        if: ${{ !startsWith(github.ref, 'refs/heads/dependabot/') }}
        env:
          TAG_SNAPSHOT: ${{ needs.prepare-variables.outputs.tag_snapshot }}
          TAG_BUILD_NUMBER: ${{ needs.prepare-variables.outputs.tag_build_number }}
        run: |
          # core-base
          docker tag ghcr.io/netcracker/qubership-core-base:test ghcr.io/netcracker/qubership-core-base:$TAG_SNAPSHOT
          docker tag ghcr.io/netcracker/qubership-core-base:test ghcr.io/netcracker/qubership-core-base:$TAG_BUILD_NUMBER
          docker tag ghcr.io/netcracker/qubership-core-base:test ghcr.io/netcracker/qubership-core-base:alpine-$TAG_SNAPSHOT
          docker tag ghcr.io/netcracker/qubership-core-base:test ghcr.io/netcracker/qubership-core-base:alpine-$TAG_BUILD_NUMBER
          docker push ghcr.io/netcracker/qubership-core-base:$TAG_SNAPSHOT
          docker push ghcr.io/netcracker/qubership-core-base:$TAG_BUILD_NUMBER
          docker push ghcr.io/netcracker/qubership-core-base:alpine-$TAG_SNAPSHOT
          docker push ghcr.io/netcracker/qubership-core-base:alpine-$TAG_BUILD_NUMBER
          # java 21 (base and prof)
          docker tag ghcr.io/netcracker/qubership-java-base:21-test ghcr.io/netcracker/qubership-java-base:21-alpine-$TAG_SNAPSHOT
          docker tag ghcr.io/netcracker/qubership-java-base:21-test ghcr.io/netcracker/qubership-java-base:21-alpine-$TAG_BUILD_NUMBER
          docker tag ghcr.io/netcracker/qubership-java-base-prof:21-test ghcr.io/netcracker/qubership-java-base-prof:21-alpine-$TAG_SNAPSHOT
          docker tag ghcr.io/netcracker/qubership-java-base-prof:21-test ghcr.io/netcracker/qubership-java-base-prof:21-alpine-$TAG_BUILD_NUMBER
          docker push ghcr.io/netcracker/qubership-java-base:21-alpine-$TAG_SNAPSHOT
          docker push ghcr.io/netcracker/qubership-java-base:21-alpine-$TAG_BUILD_NUMBER
          docker push ghcr.io/netcracker/qubership-java-base-prof:21-alpine-$TAG_SNAPSHOT
          docker push ghcr.io/netcracker/qubership-java-base-prof:21-alpine-$TAG_BUILD_NUMBER
          # java 25 (base and prof and atp)
          docker tag ghcr.io/netcracker/qubership-java-base:25-test ghcr.io/netcracker/qubership-java-base:25-alpine-$TAG_SNAPSHOT
          docker tag ghcr.io/netcracker/qubership-java-base:25-test ghcr.io/netcracker/qubership-java-base:25-alpine-$TAG_BUILD_NUMBER
          docker tag ghcr.io/netcracker/qubership-java-base-prof:25-test ghcr.io/netcracker/qubership-java-base-prof:25-alpine-$TAG_SNAPSHOT
          docker tag ghcr.io/netcracker/qubership-java-base-prof:25-test ghcr.io/netcracker/qubership-java-base-prof:25-alpine-$TAG_BUILD_NUMBER
          docker tag ghcr.io/netcracker/qubership-java-base-atp:25-test ghcr.io/netcracker/qubership-java-base-atp:25-alpine-$TAG_SNAPSHOT
          docker tag ghcr.io/netcracker/qubership-java-base-atp:25-test ghcr.io/netcracker/qubership-java-base-atp:25-alpine-$TAG_BUILD_NUMBER
          docker push ghcr.io/netcracker/qubership-java-base:25-alpine-$TAG_SNAPSHOT
          docker push ghcr.io/netcracker/qubership-java-base:25-alpine-$TAG_BUILD_NUMBER
          docker push ghcr.io/netcracker/qubership-java-base-prof:25-alpine-$TAG_SNAPSHOT
          docker push ghcr.io/netcracker/qubership-java-base-prof:25-alpine-$TAG_BUILD_NUMBER
          docker push ghcr.io/netcracker/qubership-java-base-atp:25-alpine-$TAG_SNAPSHOT
          docker push ghcr.io/netcracker/qubership-java-base-atp:25-alpine-$TAG_BUILD_NUMBER
          # core-base UBI
          docker tag ghcr.io/netcracker/qubership-core-base:ubi-test ghcr.io/netcracker/qubership-core-base:ubi-$TAG_SNAPSHOT
          docker tag ghcr.io/netcracker/qubership-core-base:ubi-test ghcr.io/netcracker/qubership-core-base:ubi-$TAG_BUILD_NUMBER
          docker push ghcr.io/netcracker/qubership-core-base:ubi-$TAG_SNAPSHOT
          docker push ghcr.io/netcracker/qubership-core-base:ubi-$TAG_BUILD_NUMBER
          # java 25 UBI (base and prof)
          docker tag ghcr.io/netcracker/qubership-java-base:25-ubi-test ghcr.io/netcracker/qubership-java-base:25-ubi-$TAG_SNAPSHOT
          docker tag ghcr.io/netcracker/qubership-java-base:25-ubi-test ghcr.io/netcracker/qubership-java-base:25-ubi-$TAG_BUILD_NUMBER
          docker tag ghcr.io/netcracker/qubership-java-base-prof:25-ubi-test ghcr.io/netcracker/qubership-java-base-prof:25-ubi-$TAG_SNAPSHOT
          docker tag ghcr.io/netcracker/qubership-java-base-prof:25-ubi-test ghcr.io/netcracker/qubership-java-base-prof:25-ubi-$TAG_BUILD_NUMBER
          docker push ghcr.io/netcracker/qubership-java-base:25-ubi-$TAG_SNAPSHOT
          docker push ghcr.io/netcracker/qubership-java-base:25-ubi-$TAG_BUILD_NUMBER
          docker push ghcr.io/netcracker/qubership-java-base-prof:25-ubi-$TAG_SNAPSHOT
          docker push ghcr.io/netcracker/qubership-java-base-prof:25-ubi-$TAG_BUILD_NUMBER
          # java 21 UBI (base and prof)
          docker tag ghcr.io/netcracker/qubership-java-base:21-ubi-test ghcr.io/netcracker/qubership-java-base:21-ubi-$TAG_SNAPSHOT
          docker tag ghcr.io/netcracker/qubership-java-base:21-ubi-test ghcr.io/netcracker/qubership-java-base:21-ubi-$TAG_BUILD_NUMBER
          docker tag ghcr.io/netcracker/qubership-java-base-prof:21-ubi-test ghcr.io/netcracker/qubership-java-base-prof:21-ubi-$TAG_SNAPSHOT
          docker tag ghcr.io/netcracker/qubership-java-base-prof:21-ubi-test ghcr.io/netcracker/qubership-java-base-prof:21-ubi-$TAG_BUILD_NUMBER
          docker push ghcr.io/netcracker/qubership-java-base:21-ubi-$TAG_SNAPSHOT
          docker push ghcr.io/netcracker/qubership-java-base:21-ubi-$TAG_BUILD_NUMBER
          docker push ghcr.io/netcracker/qubership-java-base-prof:21-ubi-$TAG_SNAPSHOT
          docker push ghcr.io/netcracker/qubership-java-base-prof:21-ubi-$TAG_BUILD_NUMBER
          # nginx-base
          docker tag ghcr.io/netcracker/qubership-nginx-base:test ghcr.io/netcracker/qubership-nginx-base:$TAG_SNAPSHOT
          docker tag ghcr.io/netcracker/qubership-nginx-base:test ghcr.io/netcracker/qubership-nginx-base:$TAG_BUILD_NUMBER
          docker tag ghcr.io/netcracker/qubership-nginx-base:test ghcr.io/netcracker/qubership-nginx-base:alpine-$TAG_SNAPSHOT
          docker tag ghcr.io/netcracker/qubership-nginx-base:test ghcr.io/netcracker/qubership-nginx-base:alpine-$TAG_BUILD_NUMBER
          docker push ghcr.io/netcracker/qubership-nginx-base:$TAG_SNAPSHOT
          docker push ghcr.io/netcracker/qubership-nginx-base:$TAG_BUILD_NUMBER
          docker push ghcr.io/netcracker/qubership-nginx-base:alpine-$TAG_SNAPSHOT
          docker push ghcr.io/netcracker/qubership-nginx-base:alpine-$TAG_BUILD_NUMBER
          # python-base
          python_image=ghcr.io/netcracker/qubership-python-base
          python_series=$(bash .github/scripts/python-image-series.sh)
          # Cleanup protects dotted release tags.
          python_snapshot="$python_image:${python_series/./-}-debian"
          docker tag "$python_image:debian-test" "$python_snapshot-$TAG_SNAPSHOT"
          docker tag "$python_image:debian-test" "$python_snapshot-$TAG_BUILD_NUMBER"
          docker push "$python_snapshot-$TAG_SNAPSHOT"
          docker push "$python_snapshot-$TAG_BUILD_NUMBER"
          # nodejs-base
          for major in 24 26; do
            image="ghcr.io/netcracker/qubership-nodejs-base:$major-alpine"
            docker tag "$image-test" "$image-$TAG_SNAPSHOT"
            docker tag "$image-test" "$image-$TAG_BUILD_NUMBER"
            docker push "$image-$TAG_SNAPSHOT"
            docker push "$image-$TAG_BUILD_NUMBER"
          done
