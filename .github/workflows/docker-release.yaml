---

# This GitHub Actions workflow is designed to be triggered when a release is marked as a full release.
# The workflow performs the following tasks:.
# 1. Builds and publishes a Docker image.
# 2. Creates a GitHub release.

name: Release And Publish Docker Artifact

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        default: '1.0.0'
        type: string
        description: 'Release version (e.g., 1.0.0)'
      dry-run:
        required: false
        type: boolean
        default: false
        description: 'Dry run'
      skip-nginx:
        required: false
        type: boolean
        default: false
        description: 'Skip nginx image build and publish'
permissions:
  contents: write
  packages: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create tag
        if: ${{ !inputs.dry-run }}
        uses: netcracker/qubership-workflow-hub/actions/tag-action@cdfcd0a8abd7ba80d7a04a4e9debfb4e24995f1a # v3.0.1
        with:
          ref: main
          tag-name: v${{ github.event.inputs.version }}
          tag-message: Tag v${{ github.event.inputs.version }}
          dry-run: ${{ inputs.dry-run }}

  core-base-docker-build:
    needs: [ create-tag ]
    name: Core image
    uses: Netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@05f471f3d4da2107a6ed3286f839ec517c2c18b8
    with:
      build-args: |
        BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-core-base:alpine-${{ inputs.version }}
      tags: "${{ inputs.version }},alpine-${{ inputs.version }},alpine-latest"
      config-filename: "core-base-docker-release-config.json"
      dry-run: ${{ inputs.dry-run }}

  java-prof-21-docker-build:
    needs: [ core-base-docker-build ]
    name: Java 21 image
    uses: Netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@05f471f3d4da2107a6ed3286f839ec517c2c18b8
    with:
      build-args: |
        BASE_IMAGE=ghcr.io/netcracker/qubership-core-base:alpine-${{ inputs.version }}
        BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-java-base-prof:21-alpine-${{ inputs.version }}
      tags: "21-alpine-${{ inputs.version }},21-alpine-latest"
      config-filename: "java-prof-21-docker-release-config.json"
      dry-run: ${{ inputs.dry-run }}

  java-25-docker-build:
    needs: [ core-base-docker-build ]
    name: Java 25 image
    uses: Netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@05f471f3d4da2107a6ed3286f839ec517c2c18b8
    with:
      build-args: |
        BASE_IMAGE=ghcr.io/netcracker/qubership-core-base:alpine-${{ inputs.version }}
        BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-java-base:25-alpine-${{ inputs.version }}
      tags: "25-alpine-${{ inputs.version }},25-alpine-latest"
      config-filename: "java-25-docker-release-config.json"
      dry-run: ${{ inputs.dry-run }}

  java-atp-25-docker-build:
    needs: [ java-25-docker-build ]
    name: Java ATP 25 image
    uses: Netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@05f471f3d4da2107a6ed3286f839ec517c2c18b8
    with:
      build-args: |
        BASE_IMAGE=ghcr.io/netcracker/qubership-java-base:25-alpine-${{ inputs.version }}
        BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-java-base-atp:25-alpine-${{ inputs.version }}
      tags: "25-alpine-${{ inputs.version }},25-alpine-latest"
      config-filename: "java-atp-25-docker-release-config.json"
      dry-run: ${{ inputs.dry-run }}

  java-prof-25-docker-build:
    needs: [ java-25-docker-build ]
    name: Java Prof 25 image
    uses: Netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@05f471f3d4da2107a6ed3286f839ec517c2c18b8
    with:
      build-args: |
        BASE_IMAGE=ghcr.io/netcracker/qubership-java-base:25-alpine-${{ inputs.version }}
        BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-java-base-prof:25-alpine-${{ inputs.version }}
      tags: "25-alpine-${{ inputs.version }},25-alpine-latest"
      config-filename: "java-prof-25-docker-release-config.json"
      dry-run: ${{ inputs.dry-run }}

  core-base-ubi-docker-build:
    needs: [ create-tag ]
    name: Core UBI image
    uses: Netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@05f471f3d4da2107a6ed3286f839ec517c2c18b8
    with:
      build-args: |
        BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-core-base:ubi-${{ inputs.version }}
      tags: "ubi-${{ inputs.version }},ubi-latest"
      config-filename: "core-base-ubi-docker-release-config.json"
      dry-run: ${{ inputs.dry-run }}

  java-25-ubi-docker-build:
    needs: [ core-base-ubi-docker-build ]
    name: Java 25 UBI image
    uses: Netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@05f471f3d4da2107a6ed3286f839ec517c2c18b8
    with:
      build-args: |
        BASE_IMAGE=ghcr.io/netcracker/qubership-core-base:ubi-${{ inputs.version }}
        BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-java-base:25-ubi-${{ inputs.version }}
      tags: "25-ubi-${{ inputs.version }},25-ubi-latest"
      config-filename: "java-25-ubi-docker-release-config.json"
      dry-run: ${{ inputs.dry-run }}

  java-prof-25-ubi-docker-build:
    needs: [ java-25-ubi-docker-build ]
    name: Java Prof 25 UBI image
    uses: Netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@05f471f3d4da2107a6ed3286f839ec517c2c18b8
    with:
      build-args: |
        BASE_IMAGE=ghcr.io/netcracker/qubership-java-base:25-ubi-${{ inputs.version }}
        BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-java-base-prof:25-ubi-${{ inputs.version }}
      tags: "25-ubi-${{ inputs.version }},25-ubi-latest"
      config-filename: "java-prof-25-ubi-docker-release-config.json"
      dry-run: ${{ inputs.dry-run }}

  java-prof-21-ubi-docker-build:
    needs: [ core-base-ubi-docker-build ]
    name: Java 21 UBI image
    uses: Netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@05f471f3d4da2107a6ed3286f839ec517c2c18b8
    with:
      build-args: |
        BASE_IMAGE=ghcr.io/netcracker/qubership-core-base:ubi-${{ inputs.version }}
        BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-java-base-prof:21-ubi-${{ inputs.version }}
      tags: "21-ubi-${{ inputs.version }},21-ubi-latest"
      config-filename: "java-prof-21-ubi-docker-release-config.json"
      dry-run: ${{ inputs.dry-run }}

  nginx-docker-build:
    needs: [ core-base-docker-build ]
    if: ${{ !inputs.skip-nginx }}
    name: Nginx image
    uses: Netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@05f471f3d4da2107a6ed3286f839ec517c2c18b8
    with:
      build-args: |
        BASE_IMAGE=ghcr.io/netcracker/qubership-core-base:alpine-${{ inputs.version }}
        BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-nginx-base:${{ inputs.version }}
      tags: "${{ inputs.version }},latest,alpine-${{ inputs.version }},alpine-latest"
      config-filename: "nginx-base-docker-release-config.json"
      dry-run: ${{ inputs.dry-run }}

  python-base-docker-build:
    needs: [ core-base-ubi-docker-build ]
    name: Python ${{ matrix.series }} UBI image
    strategy:
      matrix:
        series: ["3.14", "3.15"]
    uses: Netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@05f471f3d4da2107a6ed3286f839ec517c2c18b8
    with:
      build-args: |
        BASE_IMAGE=ghcr.io/netcracker/qubership-core-base:ubi-${{ inputs.version }}
        BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-python-base:${{ matrix.series }}-ubi-${{ inputs.version }}
      tags: "${{ matrix.series }}-ubi-${{ inputs.version }},${{ matrix.series }}-ubi-latest"
      config-filename: "python-${{ matrix.series }}-ubi-docker-release-config.json"
      dry-run: ${{ inputs.dry-run }}

  node-base-docker-build:
    needs: [ core-base-docker-build ]
    name: Node.js ${{ matrix.major }} Alpine image
    strategy:
      matrix:
        major: [24, 26]
    uses: Netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@05f471f3d4da2107a6ed3286f839ec517c2c18b8
    with:
      build-args: |
        BASE_IMAGE=ghcr.io/netcracker/qubership-core-base:alpine-${{ inputs.version }}
        BASE_IMAGE_TAG=ghcr.io/netcracker/qubership-nodejs-base:${{ matrix.major }}-alpine-${{ inputs.version }}
      tags: "${{ matrix.major }}-alpine-${{ inputs.version }},${{ matrix.major }}-alpine-latest"
      config-filename: "node-${{ matrix.major }}-docker-release-config.json"
      dry-run: ${{ inputs.dry-run }}

  github-release:
    needs: [create-tag]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - name: Render Docker images list
        id: images
        env:
          VERSION: ${{ inputs.version }}
          SKIP_NGINX: ${{ inputs.skip-nginx }}
        run: |
          images=(
            "qubership-core-base:alpine-${VERSION}"
            "qubership-core-base:ubi-${VERSION}"
            "qubership-java-base:25-alpine-${VERSION}"
            "qubership-java-base:25-ubi-${VERSION}"
            "qubership-java-base-prof:21-alpine-${VERSION}"
            "qubership-java-base-prof:21-ubi-${VERSION}"
            "qubership-java-base-prof:25-alpine-${VERSION}"
            "qubership-java-base-prof:25-ubi-${VERSION}"
            "qubership-java-base-atp:25-alpine-${VERSION}"
            "qubership-python-base:3.14-ubi-${VERSION}"
            "qubership-python-base:3.15-ubi-${VERSION}"
            "qubership-nodejs-base:24-alpine-${VERSION}"
            "qubership-nodejs-base:26-alpine-${VERSION}"
          )
          if [ "$SKIP_NGINX" != "true" ]; then
            images+=("qubership-nginx-base:alpine-${VERSION}")
          fi
          {
            echo "footer<<EOF"
            echo
            echo "### 🐳 Docker Images"
            echo
            echo "All images are multi-platform (linux/amd64, linux/arm64)."
            echo
            for image in "${images[@]}"; do
              echo "- [\`ghcr.io/netcracker/${image}\`](https://github.com/orgs/netcracker/packages/container/package/${image%%:*})"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main

      - name: Run Release Drafter
        uses: netcracker/release-drafter@130c08399304912ffe90e9604e4328f2fdcd7619 # v1.0.1
        with:
          config-name: release-drafter-config.yml
          publish: false
          name: ${{ inputs.version }}
          tag: v${{ inputs.version }}
          version: v${{ inputs.version }}
          latest: true
          footer: ${{ steps.images.outputs.footer }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
